<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Быстрый Обменник</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="main-content">
        <div class="card" style="max-width: 400px; margin: 50px auto;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Вход в систему</h2>
            
            <form id="loginForm" method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label" for="username">Имя пользователя</label>
                    <input class="form-input" type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input class="form-input" type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem;">
                Нет аккаунта? <a href="/registration">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;

            const passwordError = document.getElementById('passwordError');
            if (passwordError) {
                passwordError.style.display = 'none';
            }
            
            let isValid = true;

            if (password.length < 8) {
                showError('Пароль должен быть длиннее 8 символов');
                isValid = false;
            }

            if (isValid) {
                submitLoginForm(this);
            }
        });

        function showError(message) {
            let errorElement = document.getElementById('passwordError');
            
            if (!errorElement) {
                errorElement = document.createElement('div');
                errorElement.id = 'passwordError';
                errorElement.className = 'error-message';
                
                const passwordField = document.getElementById('password');
                passwordField.parentNode.appendChild(errorElement);
            }
            
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        async function submitLoginForm(form) {
            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json',
                    },
                    credentials: 'include'  
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.redirect_url) {
                        window.location.href = data.redirect_url;
                    } else if (data.role === 'admin') {
                        window.location.href = '/adminpanel';
                    } else {
                        window.location.href = '/profile';
                    }
                } else {
                    const errorData = await response.json();
                    showError(errorData.detail || 'Неверный логин или пароль');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка сети. Попробуйте еще раз.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
