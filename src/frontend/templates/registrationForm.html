<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Быстрый Обменник</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="main-content">
        <div class="card" style="max-width: 400px; margin: 50px auto;">
            <h2 style="text-align: center; margin-bottom: 8px;">Регистрация</h2>
            
            <form id="registrationForm" method="POST" action="/registration">
                <div class="form-group">
                    <label class="form-label" for="username">Имя пользователя</label>
                    <input class="form-input" type="text" id="username" name="username" required>
                    <div class="error-message" id="usernameError"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input class="form-input" type="password" id="password" name="password" required>
                    <div class="error-message" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                    <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" required>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
            </form>
            
            <p style="text-align: center; margin-top: 3px;">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const usernameError = document.getElementById('usernameError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            
            if (usernameError) usernameError.style.display = 'none';
            if (confirmPasswordError) confirmPasswordError.style.display = 'none';
            
            let isValid = true;

            try {
                const checkResponse = await fetch(`/check-username?username=${encodeURIComponent(username)}`);
                if (checkResponse.ok) {
                    const checkData = await checkResponse.json();
                    if (checkData.exists) {
                        if (usernameError) {
                            usernameError.style.display = 'block';
                            usernameError.textContent = 'Пользователь с таким username уже зарегистрирован';
                        }
                        isValid = false;
                    }
                }
            } catch (err) {
                console.error('Ошибка при проверке username:', err);
                isValid = false;
            }
            
            if (!isValid) {
                return;
            }
            
            if (password.length < 8) {
                if (confirmPasswordError) {
                    confirmPasswordError.style.display = 'block';
                    confirmPasswordError.textContent = 'Пароль должен быть длиннее 8 символов';
                }
                isValid = false;
            }
            else if (password !== confirmPassword) {
                if (confirmPasswordError) {
                    confirmPasswordError.style.display = 'block';
                    confirmPasswordError.textContent = 'Пароли не совпадают';
                }
                isValid = false;
            }
            
            if (isValid) {

                const formData = new FormData(this);
                
                const response = await fetch(this.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json',
                    }
                });

                if (response.ok) {
                    window.location.href = '/login';
                } else if (response.status === 400) {
                    const errorData = await response.json();
                    
                    if (usernameError) {
                        usernameError.style.display = 'block';
                        usernameError.textContent = errorData.detail || 'Такой username уже существует';
                    }
                } 
            }
        });
    </script>
</body>
</html>
